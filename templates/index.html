<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>五子棋對戰版</title>
  <style>
    canvas { background: burlywood; display: block; margin: 20px auto; }
    body { text-align: center; font-family: sans-serif; }
  </style>
  <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
</head>
<body>
  <h2>五子棋多人對戰</h2>
  <canvas id="board" width="600" height="600"></canvas>
  <p id="status"></p>
  <button onclick="resetGame()">重置棋盤</button>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const socket = io();
    const size = 15;
    const cell = canvas.width / size;
    let myTurn = false;
    let myColor = null;

    const board = Array.from({ length: size }, () => Array(size).fill(''));

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < size; i++) {
        ctx.beginPath();
        ctx.moveTo(cell / 2, cell / 2 + i * cell);
        ctx.lineTo(cell * (size - 0.5), cell / 2 + i * cell);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cell / 2 + i * cell, cell / 2);
        ctx.lineTo(cell / 2 + i * cell, cell * (size - 0.5));
        ctx.stroke();
      }
    }

    function drawStone(x, y, color) {
      ctx.beginPath();
      ctx.arc(cell / 2 + x * cell, cell / 2 + y * cell, cell / 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'dimgray';
      ctx.fill();
      ctx.stroke();
    }

    canvas.addEventListener('click', e => {
      const x = Math.floor(e.offsetX / cell);
      const y = Math.floor(e.offsetY / cell);
      if (board[y][x] || !myTurn) return;
      socket.emit('move', { x, y });
    });

    socket.on('move_made', data => {
      const { x, y, player } = data;
      board[y][x] = player;
      drawStone(x, y, player);
      myTurn = (player !== myColor);
      document.getElementById('status').textContent = myTurn ? "輪到你了" : "對手行動中...";
    });

    socket.on('game_over', data => {
      const { winner } = data;
      document.getElementById('status').textContent = (winner === myColor ? "你獲勝！" : "你輸了...");
      myTurn = false;
    });

    socket.on('reset_board', () => {
      for (let y = 0; y < size; y++) board[y].fill('');
      drawBoard();
      document.getElementById('status').textContent = "重新開始，請下子...";
    });

    function resetGame() {
      socket.emit('reset');
    }

    socket.on('connect', () => {
      if (!myColor) {
        myColor = 'black';
        myTurn = true;
        document.getElementById('status').textContent = "你是先手 (黑)";
      } else {
        myColor = 'white';
        myTurn = false;
        document.getElementById('status').textContent = "你是後手 (白)";
      }
    });

    drawBoard();
  </script>
</body>
</html>
